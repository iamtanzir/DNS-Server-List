name: Validate DNS data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate data files
        run: python scripts/validate.py --strict

      - name: Rebuild generated artifacts
        run: |
          python scripts/build_system.py
          python scripts/build_guard.py
          python scripts/export_hosts.py
          python scripts/export_hosts.py --doh
          python scripts/build_site.py

      - name: Check generated artifacts are committed
        run: |
          git diff --exit-code -- \
            system/ \
            blocklists/ \
            guard/extension/shorts-guard.js \
            hostnames.txt \
            hostnames-doh.txt \
            index.html || {
            echo "::error::Generated files are out of date. Run 'python scripts/build_system.py && python scripts/build_guard.py && python scripts/export_hosts.py && python scripts/export_hosts.py --doh && python scripts/build_site.py' and commit."
            exit 1
          }

      - name: Check for untracked generated files
        run: |
          git status --porcelain -- system/ blocklists/ guard/ hostnames.txt hostnames-doh.txt index.html
          test -z "$(git status --porcelain -- system/ blocklists/ guard/ hostnames.txt hostnames-doh.txt index.html)" || {
            echo "::error::Generated files exist but are not tracked. Commit them."
            exit 1
          }
