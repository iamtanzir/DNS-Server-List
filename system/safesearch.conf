# SafeSearch enforcement — Kids Guard / Kahf Guard / Family Safe
# AdGuard Home: Filters → DNS rewrites → add these CNAME records:
#   www.google.com  -> forcesafesearch.google.com
#   www.youtube.com -> restrict.youtube.com
#   www.bing.com    -> strict.bing.com
# dnsmasq 2.86+: add these lines to dnsmasq.conf
cname=www.google.com,forcesafesearch.google.com
cname=www.youtube.com,restrict.youtube.com
cname=www.bing.com,strict.bing.com
# Pi-hole: Local DNS → CNAME Records (same mapping)
